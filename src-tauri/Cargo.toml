[package]
name = "tally"
version = "1.0.0"
description = "Tally - Generador de Presupuestos en PDF (100% Local, Sin Telemetría)"
authors = ["Victoria Sanjurjo"]
license = "MIT"
edition = "2021"
default-run = "tally"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

